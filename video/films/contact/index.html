<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <!-- R Shivakumar & Associates — contact header loop. Generated by video/films/build.py. -->
    <script src="assets/gsap.min.js"></script>
    <style>
:root {
  --ground: #0e1420;
  --rule: rgba(160, 176, 196, 0.2);
  --rule-strong: rgba(160, 176, 196, 0.42);
  --ink: rgba(226, 232, 240, 0.7);
  --muted: rgba(160, 176, 196, 0.45);
  --maroon: #b0213f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 800px; overflow: hidden; background: var(--ground); }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: "IBM Plex Mono", monospace; }
.full { position: absolute; inset: 0; }
#shade { background: linear-gradient(90deg, var(--ground) 0%, rgba(14,20,32,0.9) 30%, rgba(14,20,32,0.15) 62%, rgba(14,20,32,0) 100%); }

#map { position: absolute; left: 0; top: 0; width: 2880px; height: 1760px;
  -webkit-mask-image: radial-gradient(60% 90% at 72% 50%, #000 30%, transparent 75%); mask-image: radial-gradient(60% 90% at 72% 50%, #000 30%, transparent 75%); }
#pin { position: absolute; left: 1380px; top: 400px; }
#pin .dot { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: #c8405c; box-shadow: 0 0 0 4px rgba(200,64,92,0.25); }
#pin .wave { position: absolute; left: -90px; top: -90px; width: 180px; height: 180px; border-radius: 50%; border: 2px solid rgba(200,64,92,0.6); }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="800">
      <div id="scene" class="clip full" data-start="0" data-duration="12" data-track-index="0" data-layout-allow-overflow data-layout-ignore>
<div id="mapwrap" class="full"><svg id="map" viewBox="0 0 2880 1760">
  <defs><pattern id="streets" width="480" height="480" patternUnits="userSpaceOnUse"><g stroke="rgba(160,176,196,0.22)"><line x1="0" y1="166" x2="480" y2="166" stroke-width="1" /><line x1="0" y1="174" x2="480" y2="174" stroke-width="1" /><line x1="0" y1="419" x2="480" y2="419" stroke-width="2" /><line x1="0" y1="473" x2="480" y2="473" stroke-width="1" /><line x1="0" y1="52" x2="480" y2="52" stroke-width="1" /><line x1="0" y1="136" x2="480" y2="136" stroke-width="1" /><line x1="0" y1="397" x2="480" y2="397" stroke-width="1" /><line x1="0" y1="333" x2="480" y2="333" stroke-width="1" /><line x1="0" y1="212" x2="480" y2="212" stroke-width="1" /><line x1="220" y1="0" x2="220" y2="480" stroke-width="1" /><line x1="83" y1="0" x2="83" y2="480" stroke-width="2" /><line x1="96" y1="0" x2="96" y2="480" stroke-width="1" /><line x1="399" y1="0" x2="399" y2="480" stroke-width="1" /><line x1="300" y1="0" x2="300" y2="480" stroke-width="2" /><line x1="214" y1="0" x2="214" y2="480" stroke-width="2" /><line x1="9" y1="0" x2="9" y2="480" stroke-width="2" /><line x1="293" y1="0" x2="293" y2="480" stroke-width="2" /><line x1="357" y1="0" x2="357" y2="480" stroke-width="1" /><line x1="0" y1="336.0" x2="480" y2="144.0" stroke-width="3" /></g></pattern></defs>
  <rect width="100%" height="100%" fill="url(#streets)" /></svg></div>
<div id="pin"><div class="wave" id="w1"></div><div class="wave" id="w2"></div><div class="dot"></div></div>
      </div>
      <div id="shade" class="clip full" data-start="0" data-duration="12" data-track-index="1" data-layout-ignore></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#map", { x: 0, y: 0 }, { x: -480, y: -0, duration: 12, ease: "none" }, 0);
      // Pulses repeat every 3 s (4 per loop); the second ring is offset by half a pulse and rests
      // invisible at both ends of the film, so frame 0 and frame 12 s match.
      tl.set("#w2", { opacity: 0 }, 0);
      for (let k = 0; k < 4; k++) {
        tl.fromTo("#w1", { scale: 0.1, opacity: 0.9 }, { scale: 1, opacity: 0, duration: 3, ease: "power2.out", immediateRender: false }, k * 3);
      }
      for (let k = 0; k < 3; k++) {
        tl.fromTo("#w2", { scale: 0.1, opacity: 0.9 }, { scale: 1, opacity: 0, duration: 3, ease: "power2.out", immediateRender: false }, k * 3 + 1.5);
      }

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
