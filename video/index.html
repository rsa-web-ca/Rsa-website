<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>R Shivakumar &amp; Associates — Brand Film</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Frank Ruhl Libre";
        src: url("fonts/frank-ruhl-libre-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "Frank Ruhl Libre";
        src: url("fonts/frank-ruhl-libre-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Public Sans";
        src: url("fonts/public-sans-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Public Sans";
        src: url("fonts/public-sans-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
      }

      :root {
        --band-deep: oklch(0.2 0.018 248);
        --band: oklch(0.27 0.024 247);
        --line: oklch(0.36 0.02 248);
        --ink: oklch(0.95 0.008 248);
        --ink-soft: oklch(0.78 0.014 248);
        --maroon: oklch(0.345 0.155 15);
        --maroon-bright: oklch(0.71 0.15 17);
        --paper: oklch(0.975 0.006 80);
        --paper-ink: oklch(0.24 0.02 250);
        --paper-rule: oklch(0.86 0.02 240);
      }

      body {
        margin: 0;
        background: var(--band-deep);
        color: var(--ink);
        font-family: "Public Sans", sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--band-deep);
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .serif {
        font-family: "Frank Ruhl Libre", serif;
      }
      .eyebrow {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--maroon-bright);
      }

      /* ---------- Scene 1: the ledger page ---------- */
      #s1 {
        background: var(--paper);
        color: var(--paper-ink);
      }
      .rules {
        position: absolute;
        inset: 0;
      }
      .rule {
        position: absolute;
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--paper-rule);
        transform-origin: left center;
      }
      .margin-rule {
        position: absolute;
        top: 0;
        left: 220px;
        width: 3px;
        height: 100%;
        background: var(--maroon);
        transform-origin: center top;
      }
      .ledger-figures {
        position: absolute;
        right: 140px;
        top: 0;
        width: 360px;
        height: 100%;
        font-size: 30px;
        color: oklch(0.55 0.02 248);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .ledger-figures div {
        position: absolute;
        right: 0;
        width: 100%;
      }
      .s1-copy {
        position: absolute;
        left: 300px;
        top: 330px;
        width: 1180px;
      }
      .s1-copy .eyebrow {
        color: var(--maroon);
      }
      .s1-headline {
        margin: 28px 0 0;
        font-size: 104px;
        line-height: 1.04;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .word {
        display: inline-block;
        margin-right: 0.24em;
      }
      .word.accent {
        color: var(--maroon);
        font-weight: 700;
      }

      /* ---------- Scene 2: the years ---------- */
      #s2 {
        background: var(--band-deep);
      }
      .year-wrap {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .year {
        font-size: 360px;
        line-height: 1;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      .year-bar {
        width: 900px;
        height: 6px;
        margin-top: 40px;
        background: var(--line);
        position: relative;
        overflow: hidden;
      }
      .year-bar-fill {
        position: absolute;
        inset: 0;
        background: var(--maroon-bright);
        transform-origin: left center;
      }
      .year-caption {
        margin-top: 44px;
        font-size: 44px;
        color: var(--ink-soft);
      }
      .year-caption strong {
        color: var(--ink);
        font-weight: 600;
      }

      /* ---------- Scene 3: nine services, ticked ---------- */
      #s3 {
        background: var(--band);
      }
      .s3-head {
        position: absolute;
        left: 140px;
        top: 96px;
        width: 1640px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      .s3-title {
        font-size: 72px;
        font-weight: 500;
        margin: 0;
      }
      .grid {
        position: absolute;
        left: 140px;
        top: 260px;
        width: 1640px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
      }
      .card {
        position: relative;
        height: 214px;
        padding: 34px 38px;
        box-sizing: border-box;
        background: var(--band-deep);
        border-top: 4px solid var(--maroon-bright);
      }
      .card-num {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.12em;
        color: var(--ink-soft);
      }
      .card-title {
        margin-top: 22px;
        width: 380px;
        font-size: 44px;
        line-height: 1.12;
        font-weight: 500;
      }
      .tick {
        position: absolute;
        right: 30px;
        top: 26px;
        width: 72px;
        height: 72px;
      }
      .tick path {
        fill: none;
        stroke: var(--maroon-bright);
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
      }

      /* ---------- Scene 4: sign-off ---------- */
      #s4 {
        background: var(--band-deep);
      }
      .photo {
        position: absolute;
        inset: -40px;
        background: url("assets/office.jpg") center / cover no-repeat;
      }
      .photo-shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          oklch(0.18 0.018 248 / 0.96) 0%,
          oklch(0.18 0.018 248 / 0.9) 45%,
          oklch(0.18 0.018 248 / 0.55) 100%
        );
      }
      .s4-copy {
        position: absolute;
        left: 160px;
        top: 250px;
        width: 1300px;
      }
      .logo {
        display: block;
        width: 940px;
        height: auto;
      }
      .s4-rule {
        width: 940px;
        height: 3px;
        margin: 54px 0 46px;
        background: var(--maroon-bright);
        transform-origin: left center;
      }
      .s4-line {
        font-size: 46px;
        line-height: 1.3;
        color: var(--ink);
      }
      .s4-meta {
        margin-top: 30px;
        font-size: 32px;
        color: var(--ink-soft);
        letter-spacing: 0.04em;
      }
      .s4-url {
        display: inline-block;
        margin-top: 56px;
        padding: 20px 34px;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--ink);
        background: var(--maroon);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="17"
    >
      <!-- Scene 1: a ledger page rules itself, then the firm's line is written onto it -->
      <section id="s1" class="clip" data-start="0" data-duration="4.4" data-track-index="0">
        <div class="rules" id="rules"></div>
        <div class="margin-rule" id="margin-rule"></div>
        <div class="ledger-figures" id="ledger-figures"></div>
        <div class="s1-copy">
          <div class="eyebrow" id="s1-eyebrow">Chartered Accountants · Bengaluru</div>
          <h1 class="s1-headline serif" id="s1-headline">
            <span class="word">Rendering</span><span class="word accent">audit,</span><span class="word accent">tax</span><span class="word">and</span><span class="word accent">advisory</span><span class="word">services</span><span class="word">since</span><span class="word">1997.</span>
          </h1>
        </div>
      </section>

      <!-- Scene 2: the year counter runs 1997 → today -->
      <section id="s2" class="clip" data-start="4.4" data-duration="3.8" data-track-index="0">
        <div class="year-wrap">
          <div class="eyebrow" id="s2-eyebrow">Est. 1997</div>
          <div class="year serif" id="year">1997</div>
          <div class="year-bar"><div class="year-bar-fill" id="year-bar"></div></div>
          <div class="year-caption" id="year-caption">
            <strong>Over 25 years</strong> of audit, tax &amp; advisory practice
          </div>
        </div>
      </section>

      <!-- Scene 3: nine service lines, each signed off with an auditor's tick -->
      <section id="s3" class="clip" data-start="8.2" data-duration="4.8" data-track-index="0">
        <div class="s3-head">
          <h2 class="s3-title serif" id="s3-title">Nine practice areas. One firm.</h2>
          <div class="eyebrow" id="s3-eyebrow">Services</div>
        </div>
        <div class="grid" id="grid"></div>
      </section>

      <!-- Scene 4: sign-off over the office -->
      <section id="s4" class="clip" data-start="13" data-duration="4" data-track-index="0">
        <div class="photo" id="photo" data-layout-allow-overflow></div>
        <div class="photo-shade"></div>
        <div class="s4-copy">
          <img class="logo" id="logo" src="assets/logo-white.png" alt="R Shivakumar &amp; Associates" />
          <div class="s4-rule" id="s4-rule"></div>
          <div class="s4-line serif" id="s4-line">Senior-partner attention on every engagement.</div>
          <div class="s4-meta" id="s4-meta">Audit · Tax · Advisory · NRI Services · Virtual CFO</div>
          <div class="s4-url" id="s4-url">rsa-india.in</div>
        </div>
      </section>
    </div>

    <script>
      // ---- Build static DOM (deterministic) ----
      const rules = document.getElementById("rules");
      const figures = document.getElementById("ledger-figures");
      const amounts = ["1,997.00", "24,580.00", "3,12,400.00", "48,250.50", "9,75,000.00", "1,26,300.00", "62,840.25", "4,05,110.00", "17,960.00", "2,88,000.00", "71,450.75", "5,40,200.00", "33,019.97"];
      for (let i = 0; i < 13; i++) {
        const y = 60 + i * 80;
        const r = document.createElement("div");
        r.className = "rule";
        r.style.top = y + "px";
        rules.appendChild(r);
        const f = document.createElement("div");
        f.className = "fig";
        f.style.top = y - 42 + "px";
        f.textContent = amounts[i];
        figures.appendChild(f);
      }

      const services = [
        "Audit & Assurance",
        "Income Tax Services",
        "Indirect Tax Services",
        "Documentation & Reporting",
        "NRI Services",
        "Due Diligence",
        "Virtual CFO",
        "Registrations",
        "Transaction Advisory",
      ];
      const grid = document.getElementById("grid");
      services.forEach((name, i) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML =
          '<div class="card-num">' + String(i + 1).padStart(2, "0") + "</div>" +
          '<div class="card-title serif"></div>' +
          '<svg class="tick" viewBox="0 0 72 72"><path pathLength="100" d="M14 38 L30 54 L60 18"/></svg>';
        card.querySelector(".card-title").textContent = name;
        grid.appendChild(card);
      });

      // ---- Timeline ----
      const tl = gsap.timeline({ paused: true });

      // Scene 1 — ledger rules draw in, margin rule drops, figures fade, headline writes on
      tl.fromTo("#s1 .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out", stagger: 0.04 }, 0);
      tl.fromTo("#margin-rule", { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "power3.inOut" }, 0.15);
      tl.fromTo("#ledger-figures .fig", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out", stagger: 0.035 }, 0.35);
      tl.fromTo("#s1-eyebrow", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.6);
      tl.fromTo("#s1-headline .word", { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.11 }, 0.85);
      tl.to("#ledger-figures", { opacity: 0.35, duration: 0.6 }, 2.2);
      // exit: page slides up
      tl.to("#s1 .s1-copy", { y: -60, opacity: 0, duration: 0.45, ease: "power2.in" }, 3.9);
      tl.to("#rules, #ledger-figures, #margin-rule", { opacity: 0, duration: 0.45 }, 3.9);

      // Scene 2 — year counter 1997 → 2026
      const yearEl = document.getElementById("year");
      const counter = { v: 1997 };
      tl.fromTo("#s2-eyebrow", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4 }, 4.5);
      tl.fromTo("#year", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 4.5);
      tl.fromTo(
        counter,
        { v: 1997 },
        {
          v: 2026,
          duration: 2.0,
          ease: "power2.inOut",
          onUpdate: () => {
            yearEl.textContent = String(Math.round(counter.v));
          },
        },
        4.8,
      );
      tl.fromTo("#year-bar", { scaleX: 0 }, { scaleX: 1, duration: 2.0, ease: "power2.inOut" }, 4.8);
      tl.fromTo("#year-caption", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 6.0);
      tl.to("#s2 .year-wrap", { opacity: 0, y: -40, duration: 0.4, ease: "power2.in" }, 7.8);

      // Scene 3 — cards stagger in, then each gets ticked
      tl.fromTo("#s3-title", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 8.3);
      tl.fromTo("#s3-eyebrow", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 8.4);
      tl.fromTo("#grid .card", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 8.5);
      tl.to("#grid .tick path", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out", stagger: 0.22 }, 9.5);
      tl.to("#grid .card", { opacity: 0, y: -30, duration: 0.35, ease: "power2.in", stagger: 0.03 }, 12.45);
      tl.to("#s3 .s3-head", { opacity: 0, duration: 0.35 }, 12.5);

      // Scene 4 — slow push on the office, logo and CTA
      tl.fromTo("#photo", { scale: 1.12 }, { scale: 1.0, duration: 4, ease: "none" }, 13);
      tl.fromTo("#logo", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 13.2);
      tl.fromTo("#s4-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.inOut" }, 13.6);
      tl.fromTo("#s4-line", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 14.0);
      tl.fromTo("#s4-meta", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 14.4);
      tl.fromTo("#s4-url", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.6)" }, 14.9);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
