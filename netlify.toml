[build]
  command = "npm run build"
  publish = "dist"

# Old Wix careers URL
[[redirects]]
  from = "/blank"
  to = "/careers"
  status = 301

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built JS and CSS carry a content hash in their name, so a file at a given
# URL never changes: browsers may keep it for a year. Media and images change
# rarely; a week, then revalidate.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
